# MedAgent Agentic RL Multi-GPU Accelerate Configuration
#
# 用于多卡并行训练 GRPO
#
# 使用方法:
#   accelerate launch --config_file scripts/accelerate_configs/multi_gpu.yaml scripts/agentic_rl.py
#
# 或使用 launch 脚本:
#   bash scripts/train_multi_gpu.sh

compute_environment: LOCAL_MACHINE
debug: false
distributed_type: MULTI_GPU
downcast_bf16: 'no'
enable_cpu_affinity: false
machine_rank: 0
main_training_function: main
mixed_precision: bf16
num_machines: 1
num_processes: 2  # GPU 数量，根据实际硬件调整
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false

